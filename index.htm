<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>از خاک تا تاج — نسخه ۲</title>
<style>
:root{--bg:#f1eee3;--fg:#222;--card:#fff;--bd:#d6d0bd;--ac:#3a7d44;--warn:#d4a017;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f17;--fg:#eee;--card:#282d22;--bd:#444b3a}}
:root[data-theme="dark"]{--bg:#1b1f17;--fg:#eee;--card:#282d22;--bd:#444b3a}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,system-ui,sans-serif;font-size:14px}
body{padding:6px;max-width:1100px;margin:auto}
#top{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;display:flex;align-items:center;gap:6px}
#w{position:relative}
canvas#c{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--bd);touch-action:none;background:#101410}
#zb{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:4px}
#zb button{width:34px;height:34px;padding:0;font-size:18px;background:rgba(255,255,255,.85);color:#222}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #zb button{background:rgba(40,45,34,.85);color:#eee}}
#mini{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.75);border:1px solid var(--bd);border-radius:6px;padding:2px}
#mini canvas{display:block;width:170px;height:auto;image-rendering:pixelated;border-radius:4px}
#msg{min-height:20px;margin:6px 0;opacity:.9;padding:4px 6px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:3px 0;flex-wrap:wrap}
button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer}
button.on{background:var(--ac);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.bb{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:3px}
.jgrid .row{font-size:12px;margin:0;padding:2px 4px}
#hb{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;flex:1;max-width:130px;min-width:60px}
#hb>i{display:block;height:100%;background:var(--ac);transition:width .3s,background .3s}
#hb.mid>i{background:var(--warn)}
#hb.low>i{background:var(--bad)}
.techrow{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px dashed var(--bd)}
.small{font-size:11px;opacity:.75}
</style></head><body>

<div id="top">
<span class="chip" id="era"></span>
<span class="chip" id="ses"></span>
<span class="chip" id="rs"></span>
<span class="chip" id="pop"></span>
<span class="chip">😊 <div id="hb"><i style="width:60%"></i></div></span>
</div>

<div id="w">
  <canvas id="c"></canvas>
  <div id="zb"><button id="zi">+</button><button id="zo">−</button><button id="zc">⌂</button></div>
  <div id="mini"><canvas id="mc" width="192" height="128"></canvas></div>
</div>

<div id="msg"></div>

<div class="p" id="sp" style="display:none">
  <div class="row"><span id="sn"></span><button id="ub"></button></div>
  <div class="row"><button id="dm" style="color:var(--bad)">🗑 تخریب (نصف منابع)</button></div>
</div>

<div class="p"><b>ساخت‌وساز</b> <span class="small">(انتخاب کن، بعد روی نقشه بزن — جاده رو بکش)</span>
<div class="bb" id="bld"></div>
<div class="bb"><button id="ex"></button></div></div>

<div class="p"><b>شغل‌ها</b> <button id="au" class="on">خودکار: روشن</button>
<div class="jgrid" id="jobs"></div></div>

<div class="p"><b>فناوری</b><div id="tech"></div></div>

<div class="p row" style="align-items:center">
<b>سرعت</b>
<span>
<button data-s="1" class="on">۱x</button>
<button data-s="2">۲x</button>
<button data-s="4">۴x</button>
<button id="sv">💾 ذخیره</button>
<button id="ld">📂 بارگذاری</button>
<button id="rst" style="color:var(--bad)">شروع دوباره</button>
</span></div>

<script>
'use strict';
const $=i=>document.getElementById(i);
const rnd=(a,b)=>a+Math.random()*(b-a);
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ===== ثابت‌ها =====
const T=24,W=192,H=128,VW=960,VH=600;
const cv=$('c'),g=cv.getContext('2d');cv.width=VW;cv.height=VH;

const COST={
  hut:{wood:12}, farm:{wood:15}, well:{wood:14,stone:8},
  lumber_mill:{wood:35,stone:8}, mill:{wood:28,stone:10}, bakery:{wood:22,stone:12},
  store:{wood:20,stone:5}, market:{wood:26,gold:8}, mine:{wood:25,stone:5},
  tower:{wood:40,stone:30}, barracks:{wood:60,stone:40},
  castle:{wood:200,stone:150,gold:80}
};
const NEED={camp:1,hut:4,farm:5,store:7,mine:6,lumber_mill:8,mill:9,bakery:8,market:8,well:5,tower:14,barracks:20,castle:40};
const NAME={camp:'آتشگاه',hut:'خانه',farm:'مزرعه',store:'انبار',mine:'معدن',lumber_mill:'چوب‌بری',mill:'آسیاب',bakery:'نانوایی',market:'بازار',well:'چاه',tower:'برج',barracks:'سربازخانه',castle:'قلعه',road:'جاده'};
const ICON={camp:'🔥',hut:'🏠',farm:'🌾',store:'📦',mine:'⛏️',lumber_mill:'🪚',mill:'⚙️',bakery:'🍞',market:'🏪',well:'💧',tower:'🗼',barracks:'⚔️',castle:'🏰',road:'🛤️'};
const UNL={hut:0,farm:0,lumber_mill:0,well:0,store:1,mine:1,mill:1,bakery:1,market:1,tower:2,barracks:2,castle:3};
const ERA=['قبیله','روستا','شهرک','شهر','کشور'];
const EP=[0,30,120,350,1000];
const SEAS=['بهار','تابستان','پاییز','زمستان'];
const RN={food:'غذا',wood:'چوب',stone:'سنگ',gold:'طلا',lumber:'الوار',flour:'آرد',bread:'نان'};

const JOBS={
  wood:['🪓 هیزم‌شکن','#8b5a2b',1],
  food:['🍓 جمع‌آور','#c0392b',3],
  stone:['🪨 سنگ‌کن','#888',2],
  farm:['🌾 کشاورز','#d4a017'],
  mine:['⛏️ معدنچی','#555'],
  lumber:['🪚 چوب‌بر','#a0522d'],
  mill:['⚙️ آسیابان','#7a6b4a'],
  bake:['🍞 نانوا','#c9803c'],
  build:['🔨 سازنده','#2980b9'],
  scout:['🧭 پیشاهنگ','#2e8b57'],
  guard:['🛡️ نگهبان','#8b0000']
};
const DUR={wood:3,stone:3.5,food:2.5,farm:4,mine:4,build:1.5,lumber:5,mill:5,bake:4,scout:0,guard:0};
const CT={wood:'wood',stone:'stone',food:'food',farm:'food',mine:'stone',lumber:'lumber',mill:'flour',bake:'bread'};
const INP={mill:{food:2},bake:{flour:1},lumber:{wood:1}};
const OUT={mill:{flour:3},bake:{bread:2},lumber:{lumber:2}};
const GC=[[118,192,86],[104,180,72],[168,172,72],[226,233,240]];
const HC=[8,20,45];
const TECHS={
  iron:{name:'🔨 ابزار آهنی',cost:{gold:80},desc:'ساخت +۳۰٪'},
  irrig:{name:'💧 آبیاری',cost:{gold:70},desc:'مزرعه +۳۰٪'},
  mining:{name:'⛏️ استخراج',cost:{gold:70},desc:'معدن +۳۰٪'}
};

// ===== وضعیت =====
let M,RS,SH,RD,BG,R,V,B,J,P,TR,ex,cam,z,tool,selB,tm,S,night,nd,spd=1,spT,stT,rgT,lsT,auT,won,last=0,autoOn=true,drag=null,hov=null,eraI=0,Q=[],L={1:[],2:[],3:[]};
let fog,terrainCanvas,terrainCtx,terrainDirty=true,fogCanvas,fogCtx,lastSeason=-1;
let wolves=[],happy=60,nextWolfT=90,nextEventT=90,recentFamine=false;
let techUnlocked={};
let miniCv,miniCtx,miniT=0;
let pinch=null;

// ===== شروع =====
function init(){
  M=[];RS=[];SH=[];RD=[];BG=[];
  for(let y=0;y<H;y++){
    M.push(Array(W).fill(0));RS.push(Array(W).fill(0));
    SH.push(Array.from({length:W},()=>Math.random()));
    RD.push(Array(W).fill(0));BG.push(Array(W).fill(null));
  }
  blob(4,5,7,0,22); blob(5,8,8,0,30);
  blob(1,35,6,5,12); blob(2,20,3,6,12);
  for(let i=0;i<120;i++){
    const x=Math.floor(rnd(0,W)),y=Math.floor(rnd(0,H));
    if(M[y][x]==0&&Math.hypot(x-W/2,y-H/2)>6){M[y][x]=3;RS[y][x]=5}
  }
  for(let i=0;i<25;i++){
    const a=rnd(0,6.28),d=rnd(6,11),x=Math.round(W/2+Math.cos(a)*d),y=Math.round(H/2+Math.sin(a)*d);
    const t=i%2?1:3;if(M[y][x]==0){M[y][x]=t;RS[y][x]=5}
  }
  R={food:40,wood:30,stone:0,gold:10,lumber:0,flour:0,bread:0};
  P=5;B=[];const c={t:'camp',x:W/2,y:H/2,lv:1,done:true,p:0,up:false};B.push(c);BG[c.y][c.x]=c;
  TR={x0:W/2-20,y0:H/2-16,x1:W/2+20,y1:H/2+16};
  ex=0;J={wood:2,stone:0,food:2,farm:0,mine:0,lumber:0,mill:0,bake:0,build:1,scout:0,guard:0};
  V=[];syncU();
  z=0.85;cam={x:W*T/2-VW/z/2,y:H*T/2-VH/z/2};
  tool=null;selB=null;tm=0;S=0;night=false;nd=0;spT=stT=rgT=lsT=auT=0;won=false;eraI=0;Q=[];
  wolves=[];happy=60;nextWolfT=90;nextEventT=90;recentFamine=false;techUnlocked={};
  fog=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++)
    if(Math.hypot(x-W/2,y-H/2)<15)fog[y*W+x]=1;
  terrainDirty=true;lastSeason=-1;
  updateFog(true);
  buildUI();updateTechUI();
  msg('قبیلت شروع شد. چوب جمع کن، خانه بساز، جاده بکش، و مراقب گرگ‌ها باش!');
  auto();
}

function blob(type,n,r,res,minD){
  for(let i=0;i<n;i++){
    const cx=rnd(3,W-3),cy=rnd(3,H-3),rr=rnd(r*.6,r);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)
      if(M[y][x]==0&&Math.hypot(x-cx,y-cy)<rr&&Math.random()<.88&&Math.hypot(x-W/2,y-H/2)>minD)
        {M[y][x]=type;RS[y][x]=res}
  }
}

// ===== ذخیره / بارگذاری =====
const SAVE_KEY='khak_taj_v2';
function save(){
  try{
    const d={
      v:2,
      M:M.map(r=>r.join('')),RS:RS.map(r=>r.join('')),
      RD:RD.map(r=>r.join('')),SH:SH.map(r=>r.join('')),
      R,P,B:JSON.parse(JSON.stringify(B)),J,tm,TR,ex,spd,autoOn,
      tech:techUnlocked,happy,won,eraI,
      fog:Array.from(fog),
      V:V.map(v=>({x:v.x,y:v.y,job:v.job}))
    };
    localStorage.setItem(SAVE_KEY,JSON.stringify(d));
    msg('💾 بازی ذخیره شد');
    return true;
  }catch(e){msg('خطا در ذخیره: '+e.message);return false}
}
function load(){
  const s=localStorage.getItem(SAVE_KEY);
  if(!s){msg('ذخیره‌ای پیدا نشد');return false}
  try{
    const d=JSON.parse(s);
    M=d.M.map(r=>r.split('').map(Number));
    RS=d.RS.map(r=>r.split('').map(Number));
    RD=d.RD.map(r=>r.split('').map(Number));
    SH=d.SH.map(r=>r.split('').map(Number));
    R=d.R;P=d.P;B=d.B;J=d.J;tm=d.tm;TR=d.TR;ex=d.ex;spd=d.spd;autoOn=d.autoOn;
    techUnlocked=d.tech||{};happy=d.happy||60;won=d.won||false;eraI=d.eraI||0;
    fog=new Uint8Array(d.fog);
    BG=[];for(let y=0;y<H;y++)BG.push(Array(W).fill(null));
    for(const b of B)BG[b.y][b.x]=b;
    V=(d.V||[]).map(v=>({...nv(),x:v.x,y:v.y,job:v.job}));
    z=0.85;cam={x:W*T/2-VW/z/2,y:H*T/2-VH/z/2};
    wolves=[];nextWolfT=90;nextEventT=90;recentFamine=false;
    terrainDirty=true;lastSeason=-1;updateFog(true);
    buildUI();updateTechUI();
    document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',+x.dataset.s==spd));
    msg('📂 بازی بارگذاری شد');
    return true;
  }catch(e){msg('خطا در بارگذاری: '+e.message);return false}
}

// ===== villagers =====
const nv=()=>({x:W/2+rnd(-1,1),y:H/2+rnd(-1,1),job:null,st:'seek',t:0,carry:0,ct:'food',ph:0,mov:false,hp:100,mx:100});
function syncU(){
  const n=Math.min(P,80);
  while(V.length<n)V.push(nv());
  while(V.length>n)V.pop();
  assign();
}
function assign(){
  for(const k in J){const a=V.filter(v=>v.job==k);
    while(a.length>J[k]){const v=a.pop();v.job=null;v.carry=0}}
  for(const v of V)if(!v.job)for(const k in J)
    if(V.filter(u=>u.job==k).length<J[k]){v.job=k;v.st='seek';break}
}
function auto(){
  const n=V.length,cnt=t=>B.filter(b=>b.t==t&&b.done).length,bs=B.filter(b=>!b.done||b.up).length;
  J.farm=Math.min(cnt('farm')*3,Math.floor(n*.35));
  J.mine=Math.min(cnt('mine')*3,Math.floor(n*.18));
  J.lumber=Math.min(cnt('lumber_mill')*2,Math.floor(n*.12));
  J.mill=Math.min(cnt('mill')*2,Math.floor(n*.1));
  J.bake=Math.min(cnt('bakery')*2,Math.floor(n*.1));
  J.guard=Math.min(cnt('tower')+cnt('barracks')*2,Math.floor(n*.15));
  J.scout=V.length>15?1:0;
  J.build=Math.min(Math.max(1,bs*2),Math.ceil(n*.2));
  const r=Math.max(0,n-J.farm-J.mine-J.lumber-J.mill-J.bake-J.guard-J.scout-J.build);
  J.food=Math.max(1,Math.round(r*.3));
  J.wood=Math.max(1,Math.round(r*.5));
  J.stone=Math.max(0,r-J.food-J.wood);
  assign();
}

const era=()=>{
  let e=0;EP.forEach((p,i)=>{if(P>=p)e=i});
  const hasCastle=B.some(b=>b.t=='castle'&&b.done);
  if(e>=4&&!hasCastle)e=3;
  if(e>=3&&!B.some(b=>b.t=='barracks'&&b.done))e=Math.min(e,2);
  return e;
};
const maxLv=()=>era()>=2?3:era()>=1?2:1;
const cap=()=>B.reduce((s,b)=>s+(!b.done?0:b.t=='hut'?HC[b.lv-1]:b.t=='castle'?50*b.lv:b.t=='camp'?10:b.t=='barracks'?15:0),0);
const capR=()=>200+B.reduce((s,b)=>s+(b.t=='store'&&b.done?250*b.lv:0),0)+P*3;
const upCost=b=>{const c=COST[b.t],r={};for(const k in c)r[k]=Math.ceil(c[k]*1.8*b.lv);r.stone=(r.stone||0)+6*b.lv;return r};
const upNeed=b=>Math.ceil(NEED[b.t]*(b.lv+1)*.6);
const tcost=()=>({wood:40*(ex+1),food:20*(ex+1),stone:12*ex});
const canPay=c=>Object.keys(c).every(k=>R[k]>=c[k]);
const pay=c=>{for(const k in c)R[k]-=c[k]};
const costStr=c=>Object.entries(c).map(([k,v])=>RN[k]+' '+fa(v)).join('، ');
const inT=(x,y)=>x>=TR.x0&&x<TR.x1&&y>=TR.y0&&y<TR.y1;

function lists(){
  L={1:[],2:[],3:[]};
  for(let y=TR.y0;y<TR.y1;y++)for(let x=TR.x0;x<TR.x1;x++){
    const t=M[y][x];if(t>=1&&t<=3)L[t].push([x,y]);
  }
}
function near(v,f,d2){let best=null,bd=d2||1e9;
  for(const b of B)if(f(b)){const d=(b.x+.5-v.x)**2+(b.y+.5-v.y)**2;if(d<bd){bd=d;best=b}}
  return best}
function find(v){
  const k=v.job;
  if(k=='farm'||k=='mine'||k=='lumber'||k=='mill'||k=='bake'){
    const b=near(v,b=>b.t==k&&b.done);return b&&{x:b.x,y:b.y,b}}
  if(k=='build'){const b=near(v,b=>!b.done||b.up);return b&&{x:b.x,y:b.y,b}}
  if(k=='scout')return null;
  if(k=='guard'){const b=near(v,b=>(b.t=='tower'||b.t=='barracks')&&b.done);
    if(b)return{x:b.x,y:b.y,b};return null}
  const ty=JOBS[k]?JOBS[k][2]:1;let best=null,bd=1e9;
  for(const[x,y]of L[ty]||[]){if(M[y][x]!=ty)continue;
    const d=(x+.5-v.x)**2+(y+.5-v.y)**2;if(d<bd){bd=d;best={x,y,ty}}}
  return best;
}
const wat=(x,y)=>{x=Math.floor(x);y=Math.floor(y);return x<0||y<0||x>=W||y>=H||M[y][x]==4};

function addP(x,y,vx,vy,l,c,s){if(Q.length<500)Q.push({x,y,vx,vy,l,m:l,c,s})}

function step(v,dt){
  if(v.hp<=0)return;
  const tx0=Math.floor(v.x),ty0=Math.floor(v.y);
  const f=(RD[ty0]&&RD[ty0][tx0])?1.7:(M[ty0]&&M[ty0][tx0]==5)?.6:1;
  const prodMul=(0.5+happy/100);
  const sp=2.4*dt*f;v.mov=false;
  const mv=(tx,ty)=>{
    const dx=tx-v.x,dy=ty-v.y,d=Math.hypot(dx,dy);
    if(d<.2)return true;
    v.mov=true;v.ph+=dt*9;
    const nx=v.x+dx/d*sp,ny=v.y+dy/d*sp;
    if(!wat(nx,ny)){v.x=nx;v.y=ny}
    else if(!wat(nx,v.y))v.x=nx;
    else if(!wat(v.x,ny))v.y=ny;
    return false;
  };
  const wander=()=>{
    if(!v.w||mv(v.w[0],v.w[1]))
      v.w=[Math.max(1,Math.min(W-1,v.x+rnd(-4,4))),Math.max(1,Math.min(H-1,v.y+rnd(-4,4)))];
  };
  // اگر گرگ نزدیک است و نگهبان نیست → فرار
  const wolf=nearW(v,3);
  if(wolf&&v.job!='guard'){
    const dx=v.x-wolf.x,dy=v.y-wolf.y,d=Math.hypot(dx,dy)||1;
    mv(v.x+dx/d*2,v.y+dy/d*2);return;
  }
  if(!v.job){wander();return}
  if(v.st=='seek'){v.tg=find(v);v.t=0;v.st=v.tg?'go':'idle';return}
  if(v.st=='idle'){wander();v.t+=dt;if(v.t>1.5)v.st='seek';return}
  const mult=Math.max(1,P/Math.max(1,V.length))*prodMul;

  if(v.st=='go'){
    if(mv(v.tg.x+.5,v.tg.y+.5)){v.st='work';v.t=0}
    return;
  }
  if(v.st=='work'){
    const tg=v.tg;v.t+=dt;
    if(Math.random()<dt*5)
      addP((tg.x+.5)*T,(tg.y+.5)*T,rnd(-14,14),rnd(-22,-8),.5,
        v.job=='build'?'#c9a66b':v.job=='wood'?'#8b5a2b':'#bbb',2);
    if(v.t<DUR[v.job]*(techUnlocked.iron&&v.job=='build'?.7:1))return;
    v.t=0;

    if(v.job=='build'){
      const b=tg.b,nd2=b.up?upNeed(b):NEED[b.t];
      if(b.done&&!b.up){v.st='seek';return}
      b.p++;
      if(b.p>=nd2){
        if(b.up){b.lv++;b.up=false;msg(NAME[b.t]+' ارتقا پیدا کرد → سطح '+fa(b.lv))}
        else{b.done=true;msg(NAME[b.t]+' ساخته شد!')}
        b.p=0;v.st='seek';
      }
      return;
    }

    // زنجیره تولید
    if(INP[v.job]){
      const b=tg.b;if(!b||!b.done){v.st='seek';return}
      const inp=INP[v.job],out=OUT[v.job];
      if(!Object.keys(inp).every(k=>R[k]>=inp[k])){v.st='idle';v.t=0;return}
      for(const k in inp)R[k]-=inp[k];
      const ok=Object.keys(out)[0];
      v.carry=Math.round(Object.values(out)[0]*mult);
      v.ct=ok;v.st='ret';return;
    }

    // جمع‌آوری خام
    if(v.job=='farm'||v.job=='mine'){
      const lv=tg.b.lv;
      let base=v.job=='farm'?(S==3?0:5):5;
      if(v.job=='farm'&&techUnlocked.irrig)base*=1.3;
      if(v.job=='mine'&&techUnlocked.mining)base*=1.3;
      v.carry=Math.round(base*lv*mult);
      v.ct=CT[v.job];v.st=v.carry?'ret':'idle';return;
    }
    if(!tg||M[tg.y][tg.x]!=tg.ty){v.st='seek';return}
    RS[tg.y][tg.x]--;
    if(RS[tg.y][tg.x]<=0)M[tg.y][tg.x]=0;
    let base=(v.job=='food'&&S==3)?2:3;
    if(v.job=='stone')base*=1.2;
    v.carry=Math.round(base*mult);v.ct=CT[v.job];
    v.st='ret';return;
  }
  if(v.st=='ret'){
    const s=near(v,b=>(b.t=='camp'||b.t=='store')&&b.done);
    if(!s){v.st='seek';return}
    if(mv(s.x+.5,s.y+.5)){
      R[v.ct]=Math.min(capR(),R[v.ct]+v.carry);v.carry=0;v.st='seek';
    }
  }
}

// ===== گرگ‌ها و رزم =====
function spawnWolf(){
  const side=Math.floor(Math.random()*4);let x,y;
  if(side==0){x=rnd(0,W);y=1}
  else if(side==1){x=rnd(0,W);y=H-2}
  else if(side==2){x=1;y=rnd(0,H)}
  else{x=W-2;y=rnd(0,H)}
  // فقط خارج از قلمرو
  if(inT(Math.floor(x),Math.floor(y)))return;
  wolves.push({x,y,hp:40,st:'seek',t:0,atkCd:0});
  msg('🐺 یه گرگ نزدیک شد!');
}
function nearW(v,r){
  let best=null,bd=r*r;
  for(const w of wolves){const d=(w.x-v.x)**2+(w.y-v.y)**2;if(d<bd){bd=d;best=w}}
  return best;
}
function updateWolves(dt){
  nextWolfT-=dt;
  if(nextWolfT<=0&&era()>=1){
    nextWolfT=Math.max(45,120-era()*15);
    if(wolves.length<era()+1)spawnWolf();
  }
  for(let i=wolves.length-1;i>=0;i--){
    const w=wolves[i];
    // هدف: نزدیک‌ترین villager
    let tgt=null,bd=1e9;
    for(const v of V){const d=(v.x-w.x)**2+(v.y-w.y)**2;if(d<bd){bd=d;tgt=v}}
    if(!tgt){wolves.splice(i,1);continue}
    const dx=tgt.x-w.x,dy=tgt.y-w.y,d=Math.hypot(dx,dy);
    const sp=1.8*dt;
    // حرکت
    if(d>0.9){w.x+=dx/d*sp;w.y+=dy/d*sp}
    else{
      w.atkCd-=dt;
      if(w.atkCd<=0){
        w.atkCd=1;
        tgt.hp-=8;
        addP(tgt.x*T,tgt.y*T,rnd(-8,8),-18,.6,'#c0392b',2);
        if(tgt.hp<=0){
          msg('💀 یه روستایی توسط گرگ کشته شد');
          const idx=V.indexOf(tgt);if(idx>=0)V.splice(idx,1);
          P=Math.max(1,P-1);syncU();
          wolves.splice(i,1);continue;
        }
      }
    }
    // حمله از برج‌ها
    for(const b of B){
      if(b.t=='tower'&&b.done){
        const dd=Math.hypot(b.x-w.x,b.y-w.y);
        if(dd<8){
          w.hp-=dt*12;
          if(Math.random()<dt*3)
            addP(b.x*T+12,b.y*T,rnd(-4,4),rnd(-20,-5),.5,'#ffe066',1.5);
        }
      }
    }
    // حمله از نگهبان‌ها
    for(const v of V)if(v.job=='guard'){
      const dd=Math.hypot(v.x-w.x,v.y-w.y);
      if(dd<4){w.hp-=dt*20;
        if(Math.random()<dt*2)addP(w.x*T,w.y*T,rnd(-8,8),-15,.4,'#e74c3c',1.5);
      }
    }
    if(w.hp<=0){
      wolves.splice(i,1);
      R.food=Math.min(capR(),R.food+3);
      msg('🐺 گرگ کشته شد (+۳ غذا)');
    }
  }
}

// ===== شادی =====
function updateHappy(){
  let h=50;
  const fp=R.food/Math.max(1,P);
  if(fp>3)h+=20;else if(fp>1.5)h+=10;else if(fp<0.5)h-=30;
  if(R.bread>P*.5)h+=10;
  if(P/Math.max(1,cap())<.6)h+=10;else if(P/Math.max(1,cap())>.9)h-=10;
  if(B.some(b=>b.t=='well'&&b.done))h+=5;
  if(B.some(b=>b.t=='market'&&b.done))h+=5;
  if(R.gold>50)h+=5;
  if(recentFamine)h-=20;
  if(wolves.length>0)h-=10;
  happy=happy*.95+h*.05;
  happy=clamp(happy,0,100);
}

// ===== رویدادها =====
function fireEvent(){
  const roll=Math.random();
  if(roll<.25&&S==1){msg('☀️ خشکسالی! مزرعه‌ها کم محصول میدن این فصل');recentFamine=false}
  else if(roll<.5&&S!=3){msg('🌧️ بارون! زمین‌ها سیراب شدن')}
  else if(roll<.7&&happy>65&&P<cap()){
    const n=Math.floor(rnd(2,7));P+=n;syncU();
    msg('🎉 '+fa(n)+' مهاجر به قبیله پیوستن!');
  }
  else if(roll<.85&&B.filter(b=>b.done&&b.t!='camp').length>2){
    const cands=B.filter(b=>b.done&&b.t!='camp');
    const b=cands[Math.floor(Math.random()*cands.length)];
    b.done=false;b.p=0;msg('🔥 آتش‌سوزی! '+NAME[b.t]+' آسیب دید');
  }
  else if(happy<30){
    const loss=Math.max(1,Math.floor(P*.05));P-=loss;syncU();
    msg('🤒 بیماری شیوع پیدا کرد، '+fa(loss)+' نفر از دست رفتن');
  }
}

// ===== آپدیت اصلی =====
function upd(dt){
  tm+=dt;
  S=Math.floor(tm/45)%4;
  const l=.5+.5*Math.sin(tm/90*6.2832+1);nd=Math.max(0,.45-l)/.45*.5;night=nd>.12;
  lsT-=dt;if(lsT<=0){lsT=1;lists()}
  V.forEach(v=>step(v,dt));
  updateWolves(dt);
  R.food=Math.max(0,R.food-.06*P*dt);
  updateHappy();

  spT+=dt;
  if(spT>4){spT=0;
    const n=Math.min(cap()-P,Math.max(1,Math.floor(P*.06)));
    if(n>0&&R.food>=n*2+5&&happy>30){R.food-=n*2;P+=n;syncU()}
  }
  if(R.food<=0){
    stT+=dt;
    if(stT>10&&P>1){
      stT=0;P=Math.max(1,P-Math.max(1,Math.floor(P*.03)));
      syncU();msg('💀 قحطی! آدما دارن از گرسنگی میمیرن');
      recentFamine=true;
    }
  }else{stT=0;if(R.food>P*2)recentFamine=false}

  rgT+=dt;
  if(rgT>1.5){rgT=0;
    for(let i=0;i<15;i++){
      const x=Math.floor(rnd(1,W-1)),y=Math.floor(rnd(1,H-1));
      if(M[y][x]==0&&!BG[y][x]&&!RD[y][x]&&
        [M[y][x-1],M[y][x+1],M[y-1][x],M[y+1][x]].includes(1)&&Math.random()<.35){
        M[y][x]=1;RS[y][x]=5;break;
      }
    }
    terrainDirty=true;
  }

  auT+=dt;if(autoOn&&auT>6){auT=0;auto()}

  // فرگ
  lsT-=dt;
  updateFog();

  // رویداد
  nextEventT-=dt;
  if(nextEventT<=0){nextEventT=Math.max(60,120-era()*10);fireEvent()}

  const e=era();
  if(e>eraI){eraI=e;msg('🎉 عصر جدید: '+ERA[e])}
  if(!won&&e==4){won=true;msg('👑 تبریک! از قبیله به کشور رسیدی!')}

  // ذرات
  for(const b of B)if(b.done&&Math.random()<dt*(b.t=='camp'?5:(b.t=='hut'&&(S==3||night)?.6:0)))
    addP((b.x+(b.t=='camp'?.5:.75))*T,(b.y+(b.t=='camp'?.6:0))*T,rnd(-3,3),-14,2,'#aaa',2.5);
  const vw=VW/z;
  if(S==3&&Q.length<400)for(let i=0;i<2;i++)
    addP(cam.x+rnd(0,vw),cam.y-4,rnd(-8,8),rnd(25,40),(VH/z+8)/30,'#fff',1.6);
  if(S==2&&Math.random()<.25)
    addP(cam.x+rnd(0,vw),cam.y-4,rnd(-10,10),rnd(18,30),(VH/z+8)/22,
      Math.random()<.5?'#d9822b':'#c0392b',2);
  for(let i=Q.length-1;i>=0;i--){
    const q=Q[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;
    if(q.l<=0)Q.splice(i,1);
  }

  miniT+=dt;
  if(miniT>.5){miniT=0;drawMini()}
}

// ===== فرگ =====
function updateFog(force){
  let changed=false;
  for(let i=0;i<fog.length;i++)if(fog[i]==2){fog[i]=1;changed=true}
  const reveal=(cx,cy,r)=>{
    const r2=r*r;
    const x0=Math.max(0,cx-r|0),y0=Math.max(0,cy-r|0);
    const x1=Math.min(W,cx+r+1|0),y1=Math.min(H,cy+r+1|0);
    for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
      const dx=x-cx,dy=y-cy;
      if(dx*dx+dy*dy<=r2){const i=y*W+x;if(fog[i]!=2){fog[i]=2;changed=true}}
    }
  };
  for(const v of V)reveal(v.x|0,v.y|0,7);
  for(const b of B)if(b.done)reveal(b.x+0,b.y+0,b.t=='tower'?11:(b.t=='castle'?8:5));
  if(changed||force)renderFog();
}
function renderFog(){
  const img=fogCtx.createImageData(W,H);
  for(let i=0;i<W*H;i++){
    if(fog[i]==0){img.data[i*4]=6;img.data[i*4+1]=10;img.data[i*4+2]=14;img.data[i*4+3]=255}
    else if(fog[i]==1){img.data[i*4]=6;img.data[i*4+1]=10;img.data[i*4+2]=14;img.data[i*4+3]=160}
    else{img.data[i*4+3]=0}
  }
  fogCtx.putImageData(img,0,0);
}

// ===== رندر =====
const gcol=sh=>{const c=GC[S],k=(sh-.5)*22;return`rgb(${c[0]+k|0},${c[1]+k|0},${c[2]+k|0})`};

function rebuildTerrain(){
  const c=terrainCtx;
  c.clearRect(0,0,W*T,H*T);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const px=x*T,py=y*T,t=M[y][x],sh=SH[y][x];
    if(t==4){
      c.fillStyle=S==3?'#a9d4ec':'#3b8fd0';
      c.fillRect(px,py,T,T);
      c.strokeStyle='rgba(255,255,255,.35)';
      c.beginPath();
      const w=Math.sin(x*.8+y*.5+tm*.05)*2;
      c.moveTo(px+3,py+12+w);c.quadraticCurveTo(px+8,py+8,px+13,py+12+w);c.stroke();
      continue;
    }
    if(t==5){
      c.fillStyle=`rgb(${120+sh*30|0},${112+sh*28|0},${104+sh*25|0})`;
      c.fillRect(px,py,T,T);
      c.fillStyle='#8a8176';
      c.beginPath();c.moveTo(px-2,py+T);c.lineTo(px+12,py-6);c.lineTo(px+T+2,py+T);c.fill();
      c.fillStyle='#fff';
      c.beginPath();c.moveTo(px+8,py+2);c.lineTo(px+12,py-6);c.lineTo(px+16,py+2);c.lineTo(px+12,py);c.fill();
      c.fillStyle='rgba(0,0,0,.15)';
      c.beginPath();c.moveTo(px+12,py-6);c.lineTo(px+T+2,py+T);c.lineTo(px+12,py+T);c.fill();
      continue;
    }
    c.fillStyle=RD[y][x]?`rgb(${176+sh*14|0},${150+sh*12|0},${104+sh*10|0})`:gcol(sh);
    c.fillRect(px,py,T,T);
    if(RD[y][x]){
      c.fillStyle='rgba(90,70,40,.35)';
      c.fillRect(px+4+sh*10,py+6,2,2);c.fillRect(px+14,py+4+sh*12,2,2);
    }
    if(t==1){
      c.fillStyle='rgba(0,0,0,.18)';
      c.beginPath();c.ellipse(px+12,py+21,8*(.85+sh*.4),3,0,0,7);c.fill();
      c.fillStyle='#5a3a1a';c.fillRect(px+10.5,py+12,3,10);
      const col=[['#4caf50','#66bb6a'],['#2e7d32','#43a047'],['#c7842a','#e0a040'],['#e8f0f0','#fff']][S];
      c.fillStyle=col[0];c.beginPath();c.arc(px+12,py+9,9*(.85+sh*.4),0,7);c.fill();
      c.fillStyle=col[1];c.beginPath();c.arc(px+10,py+6,5.5*(.85+sh*.4),0,7);c.fill();
    }else if(t==2){
      c.fillStyle='#8a8a8a';c.beginPath();c.arc(px+12,py+14,8,0,7);c.fill();
      c.fillStyle='#b0b0b0';c.beginPath();c.arc(px+9,py+11,4,0,7);c.fill();
    }else if(t==3){
      c.fillStyle='#2f8f3a';c.beginPath();c.arc(px+12,py+13,8,0,7);c.fill();
      c.fillStyle='#d12c4b';
      for(const[a,b]of[[8,10],[15,12],[11,17]]){c.beginPath();c.arc(px+a,py+b,2.2,0,7);c.fill()}
    }
  }
  terrainDirty=false;lastSeason=S;
}

function draw(){
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle='#0a0e08';g.fillRect(0,0,VW,VH);
  if(terrainDirty||S!=lastSeason)rebuildTerrain();

  g.setTransform(z,0,0,z,-cam.x*z,-cam.y*z);
  // terrain
  const sx=clamp(cam.x,0,W*T-1),sy=clamp(cam.y,0,H*T-1);
  const sw=Math.min(VW/z,W*T-sx),sh=Math.min(VH/z,H*T-sy);
  if(sw>0&&sh>0)
    g.drawImage(terrainCanvas,sx,sy,sw,sh,sx,sy,sw,sh);

  // fog
  g.save();
  g.imageSmoothingEnabled=false;
  g.globalAlpha=1;
  // ذخیره transform
  const zz=z, cx=cam.x, cy=cam.y;
  g.setTransform(1,0,0,1,0,0);
  // rect تصویر فرگ
  const fx=(cx/T),fy=(cy/T),fw=(VW/zz/T),fh=(VH/zz/T);
  g.drawImage(fogCanvas,fx,fy,fw,fh,0,0,VW,VH);
  g.setTransform(zz,0,0,zz,-cx*zz,-cy*zz);
  g.imageSmoothingEnabled=true;
  g.restore();

  // مرز قلمرو
  g.strokeStyle='#ffd54f';g.setLineDash([8,6]);g.lineWidth=2;
  g.strokeRect(TR.x0*T,TR.y0*T,(TR.x1-TR.x0)*T,(TR.y1-TR.y0)*T);
  g.setLineDash([]);g.lineWidth=1;

  // ساختمان‌ها
  for(const b of [...B].sort((a,c)=>a.y-c.y)){
    const px=b.x*T,py=b.y*T,wip=!b.done;
    g.globalAlpha=wip?.5:1;
    (DR[b.t]||dHut)(px,py,b);
    g.globalAlpha=1;
    if(wip||b.up){
      const n=b.up?upNeed(b):NEED[b.t];
      g.fillStyle='#000';g.fillRect(px+2,py-8,20,3);
      g.fillStyle=b.up?'#ffc107':'#4caf50';g.fillRect(px+2,py-8,20*b.p/n,3);
      if(wip){g.strokeStyle='#8b5a2b';g.strokeRect(px+2,py+2,20,20)}
    }
    if(b==selB){g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(px,py,T,T);g.lineWidth=1}
  }

  // villagers
  for(const v of [...V].sort((a,c)=>a.y-c.y)){
    const px=v.x*T,py=v.y*T,bob=v.mov?Math.abs(Math.sin(v.ph))*1.5:0,lg=v.mov?Math.sin(v.ph)*2:0;
    g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(px,py+8,5,2,0,0,7);g.fill();
    g.fillStyle='#3a2a1a';g.fillRect(px-2.5+lg,py+4,2,4);g.fillRect(px+.5-lg,py+4,2,4);
    g.fillStyle=v.job?JOBS[v.job][1]:'#666';g.fillRect(px-3,py-3-bob,6,8);
    g.fillStyle='#f1c9a0';g.beginPath();g.arc(px,py-6-bob,3.4,0,7);g.fill();
    if(v.job=='wood'||v.job=='mine'||v.job=='stone'){g.fillStyle='#555';g.fillRect(px+3,py-6-bob,1.5,8)}
    if(v.job=='guard'){g.fillStyle='#c0392b';g.fillRect(px-3,py-4-bob,6,2)}
    if(v.job=='scout'){g.fillStyle='#2e8b57';g.fillRect(px-3,py-9-bob,6,1.5)}
    if(v.carry){g.fillStyle=v.ct=='wood'?'#8b5a2b':v.ct=='stone'?'#aaa':v.ct=='lumber'?'#a0522d':v.ct=='flour'?'#f5f0e0':v.ct=='bread'?'#c9803c':'#ffd54f';
      g.fillRect(px+3,py-2-bob,4,4)}
  }

  // wolves
  for(const w of wolves){
    const px=w.x*T,py=w.y*T;
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(px,py+8,7,2.5,0,0,7);g.fill();
    g.fillStyle='#555';g.beginPath();g.ellipse(px,py,8,5,0,0,7);g.fill();
    g.fillStyle='#333';g.beginPath();g.arc(px-6,py-2,3,0,7);g.fill();
    g.fillStyle='#e74c3c';g.fillRect(px-8,py-3,1.5,1.5);
    g.fillStyle='#555';g.fillRect(px+5,py-6,2,4);
    // hp bar
    g.fillStyle='#000';g.fillRect(px-6,py-12,12,2);
    g.fillStyle='#e74c3c';g.fillRect(px-6,py-12,12*Math.max(0,w.hp/40),2);
  }

  // particles
  for(const q of Q){
    g.globalAlpha=Math.max(0,q.l/q.m);g.fillStyle=q.c;
    g.beginPath();g.arc(q.x,q.y,q.s,0,7);g.fill();
  }
  g.globalAlpha=1;

  // ghost preview
  if(tool&&hov&&tool!='road'){
    const[hx,hy]=hov,ok=canPlace(tool,hx,hy);
    g.fillStyle=ok?'rgba(80,255,80,.35)':'rgba(255,60,60,.35)';
    g.fillRect(hx*T,hy*T,T,T);
  }

  // شب و نور آتشگاه/خانه‌ها
  g.setTransform(1,0,0,1,0,0);
  if(nd>0){
    g.fillStyle=`rgba(8,14,50,${nd})`;g.fillRect(0,0,VW,VH);
    if(night){
      const lights=[];
      for(const b of B)if(b.done&&(b.t=='camp'||b.t=='hut'||b.t=='tower'||b.t=='market')){
        lights.push([(b.x+.5)*T,(b.y+.8)*T,b.t=='camp'?90:b.t=='tower'?70:40]);
      }
      for(const[sx,sy,r]of lights){
        const gx=(sx-cam.x)*z,gy=(sy-cam.y)*z;
        if(gx<-r*z||gy<-r*z||gx>VW+r*z||gy>VH+r*z)continue;
        const gr=g.createRadialGradient(gx,gy,2,gx,gy,r*z);
        gr.addColorStop(0,'rgba(255,190,80,.55)');
        gr.addColorStop(1,'rgba(255,190,80,0)');
        g.fillStyle=gr;
        g.fillRect(gx-r*z,gy-r*z,r*2*z,r*2*z);
      }
    }
  }
}

// ===== مینی‌مپ =====
function drawMini(){
  if(!miniCtx)return;
  const img=miniCtx.createImageData(W,H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x;let r,gg,b;
    if(fog[i]==0){r=8;gg=12;b=16}
    else{
      const t=M[y][x];
      if(t==4){r=59;gg=143;b=208}
      else if(t==5){r=140;gg=132;b=124}
      else if(t==1){r=64;gg=160;b=80}
      else if(t==2){r=138;gg=138;b=138}
      else if(t==3){r=47;gg=143;b=58}
      else{r=120;gg=160;b=90}
      if(fog[i]==1){r*=0.45;gg*=0.45;b*=0.45}
    }
    img.data[i*4]=r;img.data[i*4+1]=gg;img.data[i*4+2]=b;img.data[i*4+3]=255;
  }
  miniCtx.putImageData(img,0,0);
  // buildings
  for(const b of B){
    miniCtx.fillStyle=b.t=='camp'?'#ff9800':b.t=='castle'?'#fff':
      (b.done?'#e6d8b5':'#8b5a2b');
    miniCtx.fillRect(b.x,b.y,1.5,1.5);
  }
  // villagers
  miniCtx.fillStyle='#ffeb3b';
  for(const v of V)miniCtx.fillRect(v.x|0,v.y|0,1,1);
  // wolves
  miniCtx.fillStyle='#e74c3c';
  for(const w of wolves)miniCtx.fillRect(w.x|0,w.y|0,1.5,1.5);
  // viewport rect
  miniCtx.strokeStyle='#fff';miniCtx.lineWidth=1;
  miniCtx.strokeRect(cam.x/T,cam.y/T,(VW/z)/T,(VH/z)/T);
}

// ===== ورودی =====
function canPlace(t,x,y){
  if(x<0||y<0||x>=W||y>=H||!inT(x,y)||BG[y][x])return false;
  if(t=='mine')return M[y][x]==5;
  if(t=='lumber_mill')return M[y][x]==1;
  return M[y][x]==0;
}
function click(x,y){
  if(x<0||y<0||x>=W||y>=H)return;
  if(tool&&COST[tool]){
    if(!canPlace(tool,x,y)){
      msg(tool=='mine'?'معدن فقط روی کوه داخل قلمرو':
        tool=='lumber_mill'?'چوب‌بری فقط روی جنگل':
        'اینجا نمی‌شه ساخت (داخل مرز و روی زمین خالی)');
      return;
    }
    if(!canPay(COST[tool]))return msg('منابعت کمه: '+costStr(COST[tool]));
    pay(COST[tool]);
    const b={t:tool,x,y,lv:1,done:false,p:0,up:false};
    B.push(b);BG[y][x]=b;
    msg(NAME[tool]+' گذاشته شد؛ سازنده‌ها میان.');
    return;
  }
  selB=BG[y][x]||null;
}
function paintRoad(e){
  const[x,y]=tile(e);
  if(x>=0&&y>=0&&x<W&&y<H&&inT(x,y)&&M[y][x]==0&&!BG[y][x]&&!RD[y][x]&&R.wood>=1){
    RD[y][x]=1;R.wood--;terrainDirty=true;
  }
}
const pos=e=>{const r=cv.getBoundingClientRect();return{sx:(e.clientX-r.left)/r.width*VW,sy:(e.clientY-r.top)/r.height*VH}};
const tile=e=>{const p=pos(e);return[Math.floor((cam.x+p.sx/z)/T),Math.floor((cam.y+p.sy/z)/T)]};
const clampCam=()=>{cam.x=clamp(cam.x,0,W*T-VW/z);cam.y=clamp(cam.y,0,H*T-VH/z)};
function zoom(f,cx0,cy0){
  const cx=cx0!==undefined?cx0:cam.x+VW/z/2;
  const cy=cy0!==undefined?cy0:cam.y+VH/z/2;
  const beforeX=(cx-cam.x)*z,beforeY=(cy-cam.y)*z;
  z=clamp(z*f,0.4,2.5);
  cam.x=cx-beforeX/z;cam.y=cy-beforeY/z;
  clampCam();
}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  if(e.pointerType=='touch'){
    if(!pinch)pinch={ids:[e.pointerId],d:0,x:e.clientX,y:e.clientY};
    else if(pinch.ids.length==1)pinch.ids.push(e.pointerId);
    if(pinch.ids.length==2)return;
  }
  const p=pos(e);
  drag={sx:p.sx,sy:p.sy,cx:cam.x,cy:cam.y,moved:false};
  if(tool=='road')paintRoad(e);
});
cv.addEventListener('pointermove',e=>{
  hov=tile(e);
  if(pinch&&pinch.ids.length==2){
    // pinch
    if(pinch.lastD!==undefined){
      zoom(pinch.d/pinch.lastD);
    }
    pinch.lastD=pinch.d;return;
  }
  if(!drag)return;
  if(tool=='road'){paintRoad(e);return}
  const p=pos(e),dx=p.sx-drag.sx,dy=p.sy-drag.sy;
  if(Math.hypot(dx,dy)>8)drag.moved=true;
  if(drag.moved){cam.x=drag.cx-dx/z;cam.y=drag.cy-dy/z;clampCam()}
});
cv.addEventListener('pointerup',e=>{
  if(pinch){
    if(pinch.ids.length==2){
      pinch.ids.pop();pinch.lastD=undefined;
      if(pinch.ids.length==0)pinch=null;
      return;
    }
    pinch=null;
  }
  if(drag&&!drag.moved&&tool!='road')click(...tile(e));
  drag=null;
});
cv.addEventListener('pointercancel',()=>{pinch=null;drag=null});
// برای pinch واقعی: track two touches with distance
cv.addEventListener('touchmove',e=>{
  if(e.touches.length==2){
    e.preventDefault();
    const t1=e.touches[0],t2=e.touches[1];
    const d=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
    if(pinch&&pinch.lastD){zoom(d/pinch.lastD)}
    pinch={ids:[1,2],lastD:d};
  }
},{passive:false});
cv.addEventListener('touchend',()=>{if(pinch&&pinch.lastD)pinch.lastD=undefined});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:.87)},{passive:false});
$('zi').onclick=()=>zoom(1.25);
$('zo').onclick=()=>zoom(.8);
$('zc').onclick=()=>{cam.x=W*T/2-VW/z/2;cam.y=H*T/2-VH/z/2;clampCam()};

function updateTechUI(){
  const t=$('tech');t.innerHTML='';
  for(const k in TECHS){

    const r=document.createElement('div');r.className='techrow';
    r.innerHTML=`<span>${d.name} <span class="small">(${d.desc})</span></span>

  t.onclick=e=>{

    pay(c);techUnlocked[k]=true;updateTechUI();
    msg('🔬 فناوری فعال شد: '+TECHS[k].name);
  };
}

});
$('sv').onclick=save;
$('ld').onclick=()=>{if(confirm('بازی فعلی با ذخیره جایگزین بشه؟'))load()};
$('rst').onclick=()=>{
  if(confirm('همه‌چی پاک میشه. مطمئنی؟')){localStorage.removeItem(SAVE_KEY);init()}
};

// کیبورد
document.addEventListener('keydown',e=>{
  if(e.target.tagName=='INPUT')return;
  if(e.key=='Escape'){tool=null;selB=null;msg('')}
  else if(e.key=='r'||e.key=='R'){tool=tool=='road'?null:'road';msg(tool?'جاده رو بکش':'')}
  else if(e.key=='1'){tool='hut'}
  else if(e.key=='2'){tool='farm'}
  else if(e.key=='3'){tool='store'}
  else if(e.key=='4'){tool='lumber_mill'}
  else if(e.key=='5'){tool='well'}
  else if(e.key=='6'){tool='tower'}
});

function ui(){
  const e=era();
  $('era').textContent='🏛️ '+ERA[e];
  $('ses').textContent=(night?'🌙 ':'☀️ ')+SEAS[S]+' — سال '+fa(Math.floor(tm/180)+1);
  $('rs').textContent=`🍖${fa(R.food)} 🪵${fa(R.wood)} 🪨${fa(R.stone)} 💰${fa(R.gold)} 🪚${fa(R.lumber)} 🍞${fa(R.bread)}`;
  $('pop').textContent=`👥 ${fa(P)}/${fa(cap())}`+(e<4?` (بعدی: ${fa(EP[e+1])}${e==3?' + قلعه':''})`:'');
  const hb=$('hb');hb.firstChild.style.width=happy+'%';
  hb.classList.toggle('low',happy<35);hb.classList.toggle('mid',happy>=35&&happy<60);
  for(const k in JOBS){
    const el=$('j_'+k);if(el)el.textContent=J[k];
  }
  document.querySelectorAll('[data-b]').forEach(el=>{
    const k=el.dataset.b;if(k=='road')return;
    el.disabled=e<UNL[k];
    el.classList.toggle('on',tool==k);
    if(el.disabled)el.title='باز می‌شه تو عصر '+ERA[UNL[k]];
  });
  const c=tcost(),full=TR.x0<=0&&TR.y0<=0&&TR.x1>=W&&TR.y1>=H;
  $('ex').textContent=full?'🗺️ کل نقشه مال توئه':'🗺️ گسترش قلمرو ('+costStr(c)+')';
  const sp=$('sp');
  if(selB){
    sp.style.display='';
    const b=selB,ub=$('ub');
    $('sn').textContent=`${ICON[b.t]||'🔥'} ${NAME[b.t]} — سطح ${fa(b.lv)}${!b.done?' (در حال ساخت)':''}`;
    ub.style.display=b.t=='camp'?'none':'';
    ub.disabled=!b.done||b.up||b.lv>=maxLv();
    ub.textContent=b.up?'در حال ارتقا…':b.lv>=3?'حداکثر سطح':
      b.lv>=maxLv()?'عصر بعدی لازمه':'⬆️ ارتقا ('+costStr(upCost(b))+')';
    $('dm').style.display=b.t=='camp'?'none':'';
  }else sp.style.display='none';
}

function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  for(let i=0;i<spd;i++)upd(dt);
  draw();ui();requestAnimationFrame(loop);
}

// ==== شروع ====
terrainCanvas=document.createElement('canvas');
terrainCanvas.width=W*T;terrainCanvas.height=H*T;
terrainCtx=terrainCanvas.getContext('2d');
fogCanvas=document.createElement('canvas');
fogCanvas.width=W;fogCanvas.height=H;
fogCtx=fogCanvas.getContext('2d');
miniCv=$('mc');miniCtx=miniCv.getContext('2d');

init();

// اگر ذخیره هست پیشنهاد ادامه
const hasSave=localStorage.getItem(SAVE_KEY);
if(hasSave){
  setTimeout(()=>{
    if(confirm('یه بازی ذخیره‌شده پیدا شد. ادامه بدیم؟'))load();
  },100);
}

// ذخیره خودکار هر ۳۰ ثانیه
setInterval(()=>{try{save()}catch(e){}},30000);

requestAnimationFrame(loop);
</script>
</body></html>
